[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cedar"
version = "0.0.1"
description = "Computational Engine for Designing Architecture Rasters"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pyqtgraph"
]

[tool.setuptools.packages.find]
where = ["."]